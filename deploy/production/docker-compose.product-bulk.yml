# Optional alongside the existing uploads overlay; disabling admission keeps workers/cleanup alive.
services:
  api:
    environment:
      PRODUCT_BULK_ENABLED: ${PRODUCT_BULK_ENABLED:-false}
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
secrets:
  anthropic_api_key:
    file: ${SECRETS_DIR:-./secrets}/anthropic_api_key
